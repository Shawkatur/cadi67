<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <!-- Building icon — mixed residential/commercial silhouette -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Main residential structure with pitched roof (left portion) -->
    <path d="M8 68V32L28 16L42 28V68" stroke="#065F46" stroke-width="3.5" fill="none"/>
    <!-- Roof peak detail -->
    <path d="M4 35L28 14L46 30" stroke="#065F46" stroke-width="3.5" fill="none"/>
    <!-- Left window -->
    <rect x="16" y="38" width="10" height="10" stroke="#065F46" stroke-width="2.5" fill="none"/>
    <!-- Door -->
    <rect x="30" y="50" width="8" height="18" stroke="#065F46" stroke-width="2.5" fill="none"/>
    <!-- Commercial extension — RIGHT PILLAR/WALL in Safety Orange -->
    <path d="M42 68V24H62V68" stroke="#F97316" stroke-width="3.5" fill="none"/>
    <!-- Commercial windows (orange structure) -->
    <rect x="47" y="30" width="10" height="8" stroke="#F97316" stroke-width="2.5" fill="none"/>
    <rect x="47" y="44" width="10" height="8" stroke="#F97316" stroke-width="2.5" fill="none"/>
    <!-- Ground line -->
    <line x1="4" y1="68" x2="66" y2="68" stroke="#065F46" stroke-width="3" />
  </g>

  <!-- Text: CADI in Forest Green, 67 in Safety Orange -->
  <text x="80" y="52" font-family="'Montserrat', system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" letter-spacing="-1">
    <tspan fill="#065F46">CADI</tspan><tspan fill="#F97316">67</tspan>
  </text>

  <!-- Tagline -->
  <text x="82" y="68" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" font-size="10" letter-spacing="3" fill="#64748B" text-transform="uppercase">
    BUILD · TRANSFORM · MAINTAIN
  </text>
</svg>
