<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Green background -->
  <rect width="32" height="32" rx="6" fill="#065F46"/>
  <!-- Simplified building mark — white residential + orange commercial pillar -->
  <g transform="translate(3, 4)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Residential portion -->
    <path d="M3 24V13L11 6L16 10V24" stroke="white" stroke-width="2.2" fill="none"/>
    <!-- Roof -->
    <path d="M1 14L11 5L18 11" stroke="white" stroke-width="2.2" fill="none"/>
    <!-- Window -->
    <rect x="6" y="14" width="5" height="4" stroke="white" stroke-width="1.5" fill="none"/>
    <!-- Commercial pillar — Orange -->
    <path d="M16 24V8H24V24" stroke="#F97316" stroke-width="2.2" fill="none"/>
    <!-- Commercial window -->
    <rect x="18" y="11" width="4" height="4" stroke="#F97316" stroke-width="1.5" fill="none"/>
    <!-- Ground -->
    <line x1="1" y1="24" x2="26" y2="24" stroke="white" stroke-width="2"/>
  </g>
</svg>
